name: Movie Alert Monitor

on:
  push:
    branches: [master]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: movie-alert-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe HollyMovieHD public endpoints
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          for path in '/movies/' '/wp-json/' '/?rest_route=/' '/feed/' '/wp-sitemap.xml' '/sitemap.xml'; do
            code=$(curl -L -A "$UA" -sS -o /tmp/holly.out -w '%{http_code}' --max-time 30 "https://hollymoviehd.cc${path}" || true)
            bytes=$(wc -c < /tmp/holly.out 2>/dev/null || echo 0)
            ctype=$(curl -L -A "$UA" -sSI --max-time 15 "https://hollymoviehd.cc${path}" 2>/dev/null | awk -F': ' 'tolower($1)=="content-type"{print $2}' | tail -1 | tr -d '\r' || true)
            echo "HollyMovieHD ${path} HTTP ${code} bytes=${bytes} type=${ctype}"
          done

      - name: Wake service and run movie check
        run: |
          curl --fail --show-error --silent \
            --max-time 150 \
            -X POST \
            https://movie-alert-bot-ui.onrender.com/cron-run
