name: Movie Alert Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: movie-alert-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Run movie check
        run: |
          curl --fail --show-error --silent \
            --max-time 180 \
            -X POST \
            https://movie-alert-bot-ui.onrender.com/cron-run
