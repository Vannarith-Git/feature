name: Movie Alert Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: movie-alert-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout monitor code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh HollyMovieHD public metadata cache
        run: |
          python scripts/update_holly_cache.py /tmp/holly_cache.json

      - name: Publish cache only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin holly-cache:holly-cache
          git checkout holly-cache
          cp /tmp/holly_cache.json holly_cache.json
          git add holly_cache.json
          if git diff --cached --quiet; then
            echo 'Holly cache unchanged.'
          else
            git commit -m 'Update HollyMovieHD metadata cache'
            git push origin holly-cache
          fi

      - name: Wake service and run movie check
        run: |
          curl --fail --show-error --silent \
            --max-time 150 \
            -X POST \
            https://movie-alert-bot-ui.onrender.com/cron-run
