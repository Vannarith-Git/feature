name: Movie Alert Monitor

on:
  push:
    branches: [master]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: movie-alert-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe HollyMovieHD public reader fallback
        run: |
          code=$(curl -L -sS -o /tmp/holly-reader.txt -w '%{http_code}' \
            --max-time 60 \
            'https://r.jina.ai/https://hollymoviehd.cc/movies/' || true)
          echo "Reader HTTP ${code}"
          echo "Reader bytes: $(wc -c < /tmp/holly-reader.txt 2>/dev/null || echo 0)"
          echo "Holly links: $(grep -o 'https://hollymoviehd.cc/[^ )]*' /tmp/holly-reader.txt 2>/dev/null | sort -u | wc -l)"
          head -25 /tmp/holly-reader.txt 2>/dev/null || true

      - name: Wake service and run movie check
        run: |
          curl --fail --show-error --silent \
            --max-time 150 \
            -X POST \
            https://movie-alert-bot-ui.onrender.com/cron-run
