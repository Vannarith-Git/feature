name: Movie Alert Monitor

on:
  push:
    branches: [master]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: movie-alert-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout monitor code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load previous metadata state
        run: |
          git fetch origin holly-cache:holly-cache
          git show holly-cache:holly_cache.json > /tmp/previous_holly.json 2>/dev/null || echo '{"items":[]}' > /tmp/previous_holly.json
          git show holly-cache:indonesia_horror_cache.json > /tmp/previous_indonesia.json 2>/dev/null || echo '{"items":[],"candidate_results":{}}' > /tmp/previous_indonesia.json
          git show holly-cache:anime_cache.json > /tmp/previous_anime.json 2>/dev/null || echo '{"items":[],"candidate_results":{}}' > /tmp/previous_anime.json
          git show holly-cache:china_action_cache.json > /tmp/previous_china.json 2>/dev/null || echo '{"items":[],"candidate_results":{}}' > /tmp/previous_china.json

      - name: Refresh public metadata caches
        run: |
          python scripts/update_holly_cache.py /tmp/holly_cache.json || cp /tmp/previous_holly.json /tmp/holly_cache.json
          python scripts/update_indonesia_cache.py /tmp/indonesia_horror_cache.json /tmp/previous_indonesia.json || cp /tmp/previous_indonesia.json /tmp/indonesia_horror_cache.json
          python scripts/update_anime_cache.py /tmp/anime_cache.json /tmp/previous_anime.json || cp /tmp/previous_anime.json /tmp/anime_cache.json
          python scripts/update_china_action_cache.py /tmp/china_action_cache.json /tmp/previous_china.json || cp /tmp/previous_china.json /tmp/china_action_cache.json

      - name: Publish cache changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout holly-cache

          python - <<'PY'
          import json, os
          pairs = [
              ('holly_cache.json', '/tmp/holly_cache.json', ['items']),
              ('indonesia_horror_cache.json', '/tmp/indonesia_horror_cache.json', ['items', 'candidate_results', 'provider_errors']),
              ('anime_cache.json', '/tmp/anime_cache.json', ['items', 'candidate_results', 'feed_errors']),
              ('china_action_cache.json', '/tmp/china_action_cache.json', ['items', 'candidate_results', 'feed_errors']),
          ]
          for old_path, new_path, keys in pairs:
              with open(new_path, encoding='utf-8') as f:
                  new = json.load(f)
              old = None
              if os.path.exists(old_path):
                  try:
                      with open(old_path, encoding='utf-8') as f:
                          old = json.load(f)
                  except Exception:
                      pass
              if old and all(old.get(k) == new.get(k) for k in keys):
                  new['generated_at'] = old.get('generated_at', new.get('generated_at'))
              with open(old_path, 'w', encoding='utf-8') as f:
                  json.dump(new, f, ensure_ascii=False, indent=2)
                  f.write('\n')
          PY

          changes="$(git status --porcelain -- holly_cache.json indonesia_horror_cache.json anime_cache.json china_action_cache.json)"
          if [ -z "$changes" ]; then
            echo 'Metadata caches unchanged.'
          else
            git add holly_cache.json indonesia_horror_cache.json anime_cache.json china_action_cache.json
            git commit -m 'Update movie metadata caches'
            git push origin holly-cache
          fi

      - name: Wake free Render bot and run movie check
        run: |
          curl --fail --show-error --silent \
            --max-time 180 \
            -X POST \
            https://movie-alert-bot-ui.onrender.com/cron-run
