name: Movie Alert Monitor

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect Jina public reader output
        run: |
          curl -L --fail --show-error --silent --max-time 60 \
            'https://r.jina.ai/https://hollymoviehd.cc/movies/' \
            -o /tmp/holly.md || true
          echo "bytes=$(wc -c < /tmp/holly.md 2>/dev/null || echo 0)"
          echo '--- first 120 lines ---'
          sed -n '1,120p' /tmp/holly.md || true
          echo '--- Holly URLs ---'
          grep -oE 'https?://hollymoviehd\.cc/[^ )]+' /tmp/holly.md | head -40 || true
