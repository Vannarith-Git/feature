name: Movie Alert Monitor

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Bing public RSS search for Holly metadata
        run: |
          q='site%3Ahollymoviehd.cc+2026+movie'
          code=$(curl -L -sS -o /tmp/bing.xml -w '%{http_code}' --max-time 30 "https://www.bing.com/search?q=${q}&format=rss" || true)
          echo "Bing RSS HTTP ${code} bytes=$(wc -c < /tmp/bing.xml 2>/dev/null || echo 0)"
          grep -oE '<item>.*</item>' /tmp/bing.xml | head -1 | sed 's/></>\n</g' | grep -E '<title>|<link>|<pubDate>' | head -20 || true

      - name: Wake service and run movie check
        run: |
          curl --fail --show-error --silent \
            --max-time 150 \
            -X POST \
            https://movie-alert-bot-ui.onrender.com/cron-run
