name: Movie Alert Monitor

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect HollyMovieHD Telegram preview
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          curl -L -A "$UA" -sS --max-time 30 'https://t.me/s/hollymoviehd' -o /tmp/hollytg.html
          echo "bytes=$(wc -c < /tmp/hollytg.html)"
          echo '--- title ---'
          grep -oE '<title>[^<]+' /tmp/hollytg.html | head -3 || true
          echo '--- post text snippets ---'
          grep -oE 'tgme_widget_message_text[^>]*>[^<]+' /tmp/hollytg.html | sed -E 's/.*>//' | head -20 || true
          echo '--- message links ---'
          grep -oE 'https://t\.me/hollymoviehd/[0-9]+' /tmp/hollytg.html | sort -u | tail -20 || true
          echo '--- holly links ---'
          grep -oE 'https?://hollymoviehd\.cc[^"< ]+' /tmp/hollytg.html | head -20 || true
          echo '--- photos ---'
          grep -oE 'background-image:url\([^)]+' /tmp/hollytg.html | head -10 || true
