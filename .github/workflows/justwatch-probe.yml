name: JustWatch Probe

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect JustWatch Indonesia provider timeline
        run: |
          curl -L --fail --show-error --silent --max-time 60 \
            'https://r.jina.ai/https://www.justwatch.com/id/provider/netflix/new/movies' \
            -o /tmp/jw.md || true
          echo "bytes=$(wc -c < /tmp/jw.md 2>/dev/null || echo 0)"
          echo '--- lines around movie links ---'
          grep -nE 'justwatch.com/id/movie/|September|Yesterday|Today' /tmp/jw.md | head -120 || true
