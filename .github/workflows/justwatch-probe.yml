name: JustWatch Probe

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test JustWatch horror filter
        run: |
          for url in \
            'https://www.justwatch.com/id/provider/netflix/new/movies?genres=hrr' \
            'https://www.justwatch.com/id/provider/amazon-prime-video/new/movies?genres=hrr' \
            'https://www.justwatch.com/id/provider/catchplay/new/movies?genres=hrr'; do
            echo "--- $url ---"
            curl -L --fail --show-error --silent --max-time 60 "https://r.jina.ai/${url}" -o /tmp/jw.md || true
            grep -oE 'https://www.justwatch.com/id/movie/[^ )]+' /tmp/jw.md | sort -u | head -20 || true
          done
