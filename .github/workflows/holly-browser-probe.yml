name: Holly Browser Probe

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test public reader on HollyMovieHD mirrors
        run: |
          for target in \
            'https://novamovie.net/movies' \
            'https://yeshd.net/movies/'; do
            echo "=== $target ==="
            reader="https://r.jina.ai/${target}"
            code=$(curl -L -sS -o /tmp/reader.txt -w '%{http_code}' --max-time 60 "$reader" || true)
            echo "HTTP $code bytes=$(wc -c < /tmp/reader.txt 2>/dev/null || echo 0)"
            echo "2026-like links: $(grep -Eo 'https?://[^ )\]]+-2026/?' /tmp/reader.txt 2>/dev/null | sort -u | wc -l)"
            grep -Eo 'https?://[^ )\]]+-20[0-9]{2}/?' /tmp/reader.txt 2>/dev/null | sort -u | head -30 || true
            echo '--- sample text ---'
            grep -Ei '2026|HDTS|WEB-DL|WEBRip|BluRay' /tmp/reader.txt 2>/dev/null | head -20 || true
          done
