name: QA KhDiaMonD Date Probe

on:
  push:
    branches: [qa-today-only]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect public movie API routes and feeds
        run: |
          python - <<'PY'
          import json, urllib.request

          def get(url):
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.status, r.headers.get('content-type',''), r.read().decode('utf-8','replace')

          status, ctype, body = get('https://khdiamond.net/wp-json/')
          root=json.loads(body)
          print('ROOT', status, 'timezone=', root.get('timezone_string'))
          routes=sorted(root.get('routes',{}))
          interesting=[r for r in routes if any(k in r.lower() for k in ('movie','tvshow','season','dooplay','dooplayer','api/v1'))]
          print('INTERESTING ROUTES:')
          for r in interesting:
              print(r)

          urls=[
            'https://khdiamond.net/wp-json/wp/v2/movies?per_page=5&orderby=date&order=desc',
            'https://khdiamond.net/wp-json/wp/v2/tvshows?per_page=5&orderby=date&order=desc',
            'https://khdiamond.net/wp-json/dooplay/search/?keyword=test',
            'https://khdiamond.net/wp-json/api/v1/',
            'https://khdiamond.net/feed/?post_type=movies',
            'https://khdiamond.net/?feed=rss2&post_type=movies',
            'https://khdiamond.net/movies/feed/',
            'https://khdiamond.net/feed/?post_type=tvshows',
          ]
          print('\nPROBES:')
          for url in urls:
              try:
                  st, ct, text=get(url)
                  print('\nURL',url,'STATUS',st,'TYPE',ct,'BYTES',len(text))
                  print(text[:1600].replace('\n',' ')[:1600])
              except Exception as e:
                  print('\nURL',url,'ERROR',type(e).__name__,str(e)[:200])
          PY
