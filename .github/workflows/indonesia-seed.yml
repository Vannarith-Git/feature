name: Indonesian Horror Seed

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Indonesian Horror baseline
        run: |
          git fetch origin holly-cache:holly-cache
          git show holly-cache:indonesia_horror_cache.json > /tmp/previous.json 2>/dev/null || echo '{"candidate_results":{}}' > /tmp/previous.json
          python scripts/update_indonesia_cache.py /tmp/indonesia_horror_cache.json /tmp/previous.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout holly-cache
          cp /tmp/indonesia_horror_cache.json indonesia_horror_cache.json
          git add indonesia_horror_cache.json
          git diff --cached --quiet || git commit -m 'Seed Indonesian Horror metadata cache'
          git push origin holly-cache
      - name: Activate source without sending old titles
        run: |
          curl --fail --show-error --silent --max-time 180 -X POST https://movie-alert-bot-ui.onrender.com/cron-run
